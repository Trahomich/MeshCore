; LuFree ("luchik") — итеративная сборка на базе ЗАВЕДОМО РАБОЧЕГО варианта
; variants/promicro (ProMicro NRF52840 от Nologo: UF2 Bootloader, S140 6.1.1).
;
; ИТЕРАЦИЯ 1 (текущая): точная копия апстримных env ProMicro_companion_radio_ble/_usb
; (добавлено только имя узла ADVERT_NAME="LuFree", чтобы устройство было видно
; в приложении MeshCore). Отличий от официальной прошивки ProMicro нет — она
; проверена на реальных платах этого семейства. Цель итерации: убедиться, что
; устройство с нашей сборкой запускается (короткая вспышка LED раз в ~4 с,
; BLE-узел "LuFree" в приложении MeshCore).
;
; ИТЕРАЦИЯ 2 (далее): замена OLED-дисплея на e-paper WeAct 2.9" через GxEPDDisplay
; (SPI1) — потребует реальной распиновки платы: CS/DC/RST/BUSY/SCK/MOSI экрана.
; ИТЕРАЦИЯ 3: 5-позиционный стик (UI_JOYSTICK_5WAY).
; Прежние наработки (вариант с нуля: screen+stick сразу) — в git-истории этого
; файла; они убраны, т.к. писались без карты пинов платы.

[env:lufree_companion_radio_ble]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
  -D MESH_DEBUG=1
  -D ADVERT_NAME='"LuFree"'
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:lufree_companion_radio_usb]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"LuFree"'
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/nrf52/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0
