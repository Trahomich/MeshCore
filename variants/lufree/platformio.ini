; LuFree ("luchik"): Heltec HT-RA62 clone (nRF52840 + SX1262)
; + WeAct Studio 2.9" e-paper 128x296 + 5-way stick + notification LED
; Все пины - заготовки, сверить с платой (variants/lufree/variant.h, target.h)

[lufree]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/lufree
  -D LUFREE
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; 5-позиционный стик: полная навигация UI (up/down/left/right/ok)
  -D UI_HAS_JOYSTICK=1
  -D UI_JOYSTICK_5WAY=1
  ; экран: e-paper 2.9" через GxEPDDisplay (пины — в target.h);
  ; LUFREE_USE_GXEPD и DISPLAY_CLASS меняются вместе (см. ветку include в target.h)
  -D LUFREE_USE_GXEPD
  -D DISPLAY_CLASS=GxEPDDisplay
;  -D DISPLAY_CLASS=NullDisplayDriver   ; запасной вариант: собрать без экрана
  ; --- контроллер панели WeAct 2.9" 128x296 (неизвестен): дефолт SSD1680 ---
  ; если экран не оживает/виснет на BUSY — закомментировать строку ниже и
  ; включить альтернативу (разбор: docs/lufree/research-epaper.md, раздел 3)
  -D EINK_DISPLAY_MODEL=GxEPD2_290_GDEY029T94     ; SSD1680 (дефолт)
;  -D EINK_DISPLAY_MODEL=GxEPD2_290_T94           ; SSD1680 (GDEM029T94)
;  -D EINK_DISPLAY_MODEL=GxEPD2_290_T94_V2        ; SSD1680 (Waveshare 2.9 V2)
;  -D EINK_DISPLAY_MODEL=GxEPD2_290_T5D           ; UC8151D (GDEW029T5D)
;  -D EINK_DISPLAY_MODEL=GxEPD2_290_M06           ; UC8151D (GDEW029M06)
;  -D EINK_DISPLAY_MODEL=GxEPD2_290_T5            ; IL0373  (GDEW029T5)
  ; масштаб логического холста UI 128x128 → панель 296x128 (landscape)
  -D EINK_SCALE_X=2.3125f     ; 296/128
  -D EINK_SCALE_Y=1.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10        ; компенсация базовой линии шрифтов (как mesh_pocket/wio)
  -D DISPLAY_ROTATION=1      ; 1/3 — landscape 296x128; поменяйте, если изображение перевёрнуто
  -D DISABLE_DIAGNOSTIC_OUTPUT
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<../variants/lufree>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  adafruit/Adafruit GFX Library @ ^1.12.1
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

debug_tool = jlink
upload_protocol = nrfutil

[env:lufree_companion_radio_ble]
extends = lufree
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${lufree.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=6
  -D AUTO_OFF_MILLIS=0
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${lufree.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${lufree.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:lufree_companion_radio_usb]
extends = lufree
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${lufree.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=6
  -D AUTO_OFF_MILLIS=0
build_src_filter = ${lufree.build_src_filter}
  +<helpers/nrf52/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${lufree.lib_deps}
  densaugeo/base64 @ ~1.4.0
