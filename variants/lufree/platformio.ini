; LuFree ("luchik") — ИТЕРАЦИЯ 2: рабочая база итерации 1 (официальная прошивка
; ProMicro, подтверждена пользователем: BLE/LoRa работают) + e-paper WeAct 2.9"
; 128x296 (SSD1680) через GxEPDDisplay.
;
; Радио НЕ тронуто: PromicroBoard.cpp, variant.cpp и target.cpp берутся из
; variants/promicro (правильные пины SX1262 для fakeTec). target.cpp для LuFree
; не запускает I2C-скан RTC (пины Wire могут принадлежать экрану).
;
; РАСПИНОВКА ЭКРАНА НЕИЗВЕСТНА (устройство собрано навесным монтажом) — пины
; подбираются ПРОШИВКОЙ САМОЙ при первом старте (variants/lufree/EPaperScan.cpp):
;   * битбэнг-гипотезы (CLK,DIN,CS,DC) + команды SWRESET/PowerOn, BUSY-отклик;
;   * LED быстро мигает во время поиска (обычно секунды, максимум 10 минут);
;   * результат сохраняется в InternalFS (/epaper.cfg) и проверяется при
;     каждом старте; перескан — только если проверка провалилась.
; Если панель не найдена — экран отключается (no-op), BLE/LoRa работают как в
; итерации 1.
; GPS отключён (-U ENV_INCLUDE_GPS): на устройстве его нет, Serial1 (пины 0/1)
; освобождается для автоподбора.

[env:lufree_companion_radio_ble]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -I variants/lufree
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"LuFree"'
  ; --- экран e-paper WeAct 2.9" (SSD1680), пины — рантайм-автоподбор ---
  -D LUFREE_EINK
  ; --- 5-позиционный стик: пины — интерактивная калибровка при первом
  ;     старте (variants/lufree/StickScan.cpp), результат в /stick.cfg ---
  -D LUFREE_STICK
  -D UI_HAS_JOYSTICK=1
  -D UI_JOYSTICK_5WAY=1
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_290_GDEY029T94
  -D EINK_SCALE_X=2.3125f
  -D EINK_SCALE_Y=1.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D DISPLAY_ROTATION=1
  -D UI_RECENT_LIST_SIZE=6
  -D AUTO_OFF_MILLIS=0
  -UENV_INCLUDE_GPS
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/promicro>
  +<../variants/lufree/EPaperScan.cpp>
  +<../variants/lufree/StickScan.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

