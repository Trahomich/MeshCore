; Luchik — «Лучик»: устройство на ProMicro nRF52840 (пины — variants/promicro,
; см. docs/luchik-targets.md). Варианты для трёх целей по CONTRACTS.md:
;   luchik_promicro   — базовый promicro (fakeTec SX1262)
;   luchik_weact290   — + e-paper WeAct 2.9" (SSD1680) с рантайм-автоподбором пинов
;                       и 5-позиционным стиком (наследие variants/lufree)
;   luchik_ra62       — радио-модуль HT-RA62 (SX1262, TCXO 1.8 В, DIO2 — RF-свитч)
; ADVERT_NAME везде "Luchik".

; ===================== promicro (базовый, без экрана) =====================
; [Promicro] как есть (fakeTec SX1262, пины PromicroBoard.h), экрана нет —
; NullDisplayDriver, GPS отключён (на «Лучике» его нет, как и в lufree).

[Luchik_Promicro]
extends = Promicro
build_flags = ${Promicro.build_flags}
  -D ADVERT_NAME='"Luchik"'
  -UENV_INCLUDE_GPS

[env:luchik_promicro_ble]
extends = Luchik_Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Luchik_Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=NullDisplayDriver
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:luchik_promicro_usb]
extends = Luchik_Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Luchik_Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=NullDisplayDriver
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/nrf52/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ============= weact290 (e-paper WeAct 2.9", наследие lufree) =============
; Копия lufree_companion_radio_ble/_usb (проверенная пользователем база):
; то же радио promicro + рантайм-автоподбор пинов экрана (EPaperScan.cpp,
; LUFREE_EINK) и 5-стик (StickScan.cpp, LUFREE_STICK). Отличие только
; ADVERT_NAME="Luchik" (по CONTRACTS.md раздел 3).

[env:luchik_weact290_ble]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -I variants/lufree
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Luchik"'
  ; --- экран e-paper WeAct 2.9" (SSD1680), пины — рантайм-автоподбор ---
  -D LUFREE_EINK
  ; --- 5-позиционный стик: пины — интерактивная калибровка при первом
  ;     старте (variants/lufree/StickScan.cpp), результат в /stick.cfg ---
  -D LUFREE_STICK
  -D UI_HAS_JOYSTICK=1
  -D UI_JOYSTICK_5WAY=1
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_290_GDEY029T94
  -D EINK_SCALE_X=2.3125f
  -D EINK_SCALE_Y=1.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D DISPLAY_ROTATION=1
  -D UI_RECENT_LIST_SIZE=6
  -D AUTO_OFF_MILLIS=0
  -UENV_INCLUDE_GPS
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/promicro>
  +<../variants/lufree/EPaperScan.cpp>
  +<../variants/lufree/StickScan.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

[env:luchik_weact290_usb]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -I variants/lufree
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Luchik"'
  ; --- экран e-paper WeAct 2.9" (SSD1680), пины — рантайм-автоподбор ---
  -D LUFREE_EINK
  ; --- 5-позиционный стик: пины — интерактивная калибровка при первом
  ;     старте (variants/lufree/StickScan.cpp), результат в /stick.cfg ---
  -D LUFREE_STICK
  -D UI_HAS_JOYSTICK=1
  -D UI_JOYSTICK_5WAY=1
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_290_GDEY029T94
  -D EINK_SCALE_X=2.3125f
  -D EINK_SCALE_Y=1.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D DISPLAY_ROTATION=1
  -D UI_RECENT_LIST_SIZE=6
  -D AUTO_OFF_MILLIS=0
  -UENV_INCLUDE_GPS
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<helpers/nrf52/*.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/promicro>
  +<../variants/lufree/EPaperScan.cpp>
  +<../variants/lufree/StickScan.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

; ===================== ra-62 (HT-RA62, без экрана) =====================
; Пины promicro (PromicroBoard.h: NSS 13, DIO1 11, RESET 10, BUSY 16,
; MISO 15, SCLK 12, MOSI 14), обвязка RA62 — docs/luchik-targets.md
; (сверено с Faketec-RA62-meshcore и supermini_nrf_ht_ra62).

[Luchik_RA62]
extends = Promicro
build_flags = ${Promicro.build_flags}
  -D ADVERT_NAME='"Luchik"'
  -D SX126X_REGISTER_PATCH=1
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -UENV_INCLUDE_GPS

[env:luchik_ra62_ble]
extends = Luchik_RA62
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
