name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # build.sh builds only the LuFree firmware (lufree_companion_radio_ble)
      # and produces .uf2 + .zip in the out/ folder
      - name: Build LuFree Firmware
        env:
          FIRMWARE_VERSION: ci
        run: /usr/bin/env bash build.sh build-companion-firmwares

      # PR builds: attach zip artifact (GitHub wraps it in an extra zip layer)
      - name: Upload Firmware Artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lufree-firmware
          path: out

      # Push to main: publish ready-to-flash files to the rolling release
      # (fixed file names, old assets are overwritten)
      - name: Prepare Release Files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd out
          ls -la
          cp lufree_companion_radio_ble-ci-*.uf2 lufree_companion_radio_ble.uf2
          cp lufree_companion_radio_ble-ci-*.zip lufree_companion_radio_ble.zip
          ls -la

      - name: Publish LuFree Firmware Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # softprops/action-gh-release при замене существующих ассетов падал
        # на втором файле (каждый ран заменял только один ассет, см. задачу
        # #16). Используем gh CLI: upsert релиза + upload --clobber с ретраями.
        run: |
          set -euo pipefail
          BODY=$(cat <<'EOF'
          Автосборка прошивки LuFree для «лучика» (ProMicro NRF52840 / fakeTec: nRF52840 + SX1262, экран WeAct 2.9" e-paper — автоподбор пинов).

          Коммит: ${{ github.sha }}

          Файлы:
          - `lufree_companion_radio_ble.zip` — DFU-пакет (внутри manifest.json) для прошивки через nRF Connect Programmer / Web Device View.
          - `lufree_companion_radio_ble.uf2` — для прошивки drag-and-drop в режиме DFU-бутлоадера (дважды нажать RESET).
          EOF
          )
          R="Trahomich/MeshCore"
          if gh release view lufree-latest -R "$R" >/dev/null 2>&1; then
            gh release edit lufree-latest -R "$R" \
              --title "LuFree Firmware (latest)" --notes "$BODY" --prerelease
          else
            gh release create lufree-latest -R "$R" --prerelease \
              --title "LuFree Firmware (latest)" --notes "$BODY"
          fi
          ok=0
          for i in 1 2 3; do
            if gh release upload lufree-latest -R "$R" \
                 out/lufree_companion_radio_ble.zip out/lufree_companion_radio_ble.uf2 \
                 --clobber; then ok=1; break; fi
            echo "upload attempt $i failed, retrying in 20s"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::release upload failed after 3 attempts"; exit 1; }
          gh release view lufree-latest -R "$R" --json assets -q '.assets[].name'

      # Also publish the firmware files to GitHub Packages (GHCR) as an OCI
      # artifact so they appear in the account's "Packages" tab.
      # Releases (above) remain the main download channel.
      - name: Publish to GitHub Packages (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL -o /tmp/oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          sudo tar -xzf /tmp/oras.tgz -C /usr/local/bin oras
          oras version
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          cd out
          oras push "ghcr.io/${OWNER}/lufree-firmware:latest" \
            --artifact-type application/vnd.lufree.firmware \
            lufree_companion_radio_ble.zip:application/zip \
            lufree_companion_radio_ble.uf2:application/octet-stream
