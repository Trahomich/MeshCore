name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      # build.sh builds only the LuFree firmware (lufree_companion_radio_ble)
      # and produces .uf2 + .zip in the out/ folder
      - name: Build LuFree Firmware
        env:
          FIRMWARE_VERSION: ci
        run: /usr/bin/env bash build.sh build-companion-firmwares

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lufree-firmware
          path: out
